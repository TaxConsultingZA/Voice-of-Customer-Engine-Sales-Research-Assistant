name: VoC Engine CI

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline sequence (each stage gates the next):
#   Lint → Unit Tests → UEC Contract → POPIA Scan → Critical Scenarios
#   → [main only] SA Regional Latency
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Lint
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Lint (black · isort · flake8)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install black==23.11.0 isort==5.12.0 flake8==6.1.0

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__,venv,.mypy_cache

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Unit Tests (coverage ≥ 85%)
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests (coverage ≥ 85%)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            --ignore=tests/critical_scenarios \
            --ignore=tests/test_popia_compliance.py \
            --ignore=tests/test_popia_scan.py \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — UEC Contract Validation
# ─────────────────────────────────────────────────────────────────────────────
  uec-contract:
    name: "UEC Contract Validation"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install jsonschema
        run: pip install jsonschema==4.19.1 pytest==7.4.3

      - name: Validate UEC contract
        run: pytest tests/test_uec_contract.py -v

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — POPIA Compliance Scan
# Fail criteria: PII confidence > 0.85 in any pipeline output
# ─────────────────────────────────────────────────────────────────────────────
  popia-scan:
    name: "POPIA Compliance Scan (Presidio threshold 0.85)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Presidio + spacy
        run: |
          pip install presidio-analyzer==2.2.33 presidio-anonymizer==2.2.33 spacy==3.7.2 pytest==7.4.3
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      - name: Run POPIA compliance tests
        run: pytest tests/test_popia_compliance.py -v
        env:
          SPACY_MODEL: en_core_web_sm

      - name: Scan processed data directory for PII leaks
        run: python scripts/popia_scan_processed.py --threshold 0.85
        env:
          SPACY_MODEL: en_core_web_sm

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 — Critical Scenario Suite
# ─────────────────────────────────────────────────────────────────────────────
  critical-scenarios:
    name: "Critical Scenario Suite"
    runs-on: ubuntu-latest
    needs: [unit-tests, uec-contract]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run critical scenarios
        run: pytest tests/critical_scenarios/ -v --timeout=60

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6 — SA Sentiment Benchmark (F1 ≥ 0.94)
# Runs only when model weights are present (skips gracefully otherwise)
# ─────────────────────────────────────────────────────────────────────────────
  sentiment-benchmark:
    name: "SA Sentiment Benchmark (F1 ≥ 0.94)"
    runs-on: ubuntu-latest
    needs: [unit-tests, popia-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Restore model weights from cache
        uses: actions/cache@v4
        id: model-cache
        with:
          path: models/
          key: sentiment-model-${{ hashFiles('models/.model-version') }}

      - name: Install ML dependencies
        run: pip install -r requirements-dev.txt scikit-learn==1.3.2

      - name: Run sentiment benchmark
        run: pytest tests/test_sentiment_accuracy.py -v --timeout=300
        env:
          MODEL_PATH: models/sentiment-sa-v2

      - name: Alert on F1 regression
        if: failure()
        run: |
          echo "::error::Sentiment F1 regression detected — build blocked."
          echo "::error::Action: rollback model weights, notify #voc-ml, investigate corpus drift."

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7 — SA Regional Latency (P95 < 500ms)
# Runs only on pushes to main — requires staging environment
# ─────────────────────────────────────────────────────────────────────────────
  sa-regional-latency:
    name: "SA Regional Latency (P95 < 500ms)"
    runs-on: ubuntu-latest
    needs: [critical-scenarios, popia-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install requests==2.31.0 numpy==1.25.2 pytest==7.4.3 pytest-timeout==2.2.0

      - name: Run SA latency tests
        run: pytest tests/integration/test_sa_latency.py -v -m integration --timeout=120
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          REDACTOR_URL: ${{ secrets.REDACTOR_URL }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 8 — Deploy to staging
# Runs only on pushes to main, after all quality gates pass.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   AZURE_REGISTRY_URL        e.g. vocengineacr.azurecr.io
#   AZURE_REGISTRY_USERNAME   ACR admin username
#   AZURE_REGISTRY_PASSWORD   ACR admin password
#   DEPLOY_HOST               IP/hostname of the staging VM
#   DEPLOY_USER               SSH user on the staging VM
#   DEPLOY_SSH_KEY            Private key for SSH access
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to staging"
    runs-on: ubuntu-latest
    needs: [sa-regional-latency]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_URL }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push sa-redactor
        uses: docker/build-push-action@v5
        with:
          context: services/sa_redactor
          target: production
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-sa-redactor:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-sa-redactor:latest

      - name: Build and push nlp
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/nlp/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-nlp:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-nlp:latest

      - name: Build and push ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-ingestion:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-ingestion:latest

      - name: Build and push decision
        uses: docker/build-push-action@v5
        with:
          context: services/decision
          target: production
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-decision:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_URL }}/voc-decision:latest

      - name: Deploy to staging VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/voc-engine
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --no-build
            docker system prune -f --filter "until=24h"
