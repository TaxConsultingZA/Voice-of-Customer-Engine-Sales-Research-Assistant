[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | venv
  | __pycache__
  | \.mypy_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requires external services (staging/cloud)",
    "slow: runs longer than 10 seconds",
]
addopts = "--strict-markers"
timeout = 120

[tool.coverage.run]
omit = [
    "tests/*",
    "scripts/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*",
    # Streamlit dashboard is a UI surface validated visually + by Streamlit's own
    # AppTest harness; it does not belong in the backend unit-coverage gate.
    "streamlit_app.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "venv", ".mypy_cache"]
extend-ignore = ["E203", "W503"]
