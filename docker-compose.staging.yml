version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# VoC Engine — Staging Stack (Azure)
# ─────────────────────────────────────────────────────────────────────────────
# Start:   docker compose -f docker-compose.staging.yml up -d --build
# Stop:    docker compose -f docker-compose.staging.yml down
#
# Differences from dev:
#   - Loads secrets from .env (never committed)
#   - No source code volume mounts — code is baked into images
#   - Resource limits set per container
#   - Azure Blob Storage used for event log and dead-letter queue
#   - spaCy model set to en_core_web_sm (faster, sufficient for staging)
#   - Single Kafka broker (same as dev; 3-broker HA configured in prod)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 15 with ltree + pgvector ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: voc-postgres-staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voc_engine}
      POSTGRES_USER: ${POSTGRES_USER:-voc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./scripts/init-ltree.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/init-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./scripts/init-sales-schema.sql:/docker-entrypoint-initdb.d/03-sales-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voc} -d ${POSTGRES_DB:-voc_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ── Redis 7.2 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.3-alpine
    container_name: voc-redis-staging
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: voc-zookeeper-staging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: voc-kafka-staging
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ── SA Redactor — POPIA PII redaction ─────────────────────────────────────
  sa-redactor:
    build:
      context: ./services/sa_redactor
      target: production
    container_name: voc-sa-redactor-staging
    ports:
      - "8085:8080"
    environment:
      PRESIDIO_THRESHOLD: "0.85"
      SPACY_MODEL: "en_core_web_sm"
      VOC_API_KEY: ${VOC_API_KEY}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  # ── NLP Service ───────────────────────────────────────────────────────────
  nlp:
    build:
      context: .
      dockerfile: services/nlp/Dockerfile
      target: production
    container_name: voc-nlp-staging
    ports:
      - "8086:8081"
    environment:
      SLANG_DICT_PATH: "/app/data/sa_slang.json"
      SLANG_FILE: "/app/data/sa_slang.json"
      SCHEMAS_PATH: "/app/schemas"
      MODEL_PATH: ${MODEL_PATH:-mock}
      NLP_CLASSIFIER_MODE: ${NLP_CLASSIFIER_MODE:-llm}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_TIMEOUT_SECONDS: ${CLAUDE_TIMEOUT_SECONDS:-20}
      VOC_API_KEY: ${VOC_API_KEY}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-voc-engine}
    volumes:
      - ./data/sa_slang.json:/app/data/sa_slang.json:ro
    depends_on:
      sa-redactor:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ── Ingestion Service ─────────────────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
      target: production
    container_name: voc-ingestion-staging
    ports:
      - "8087:8000"
    environment:
      VOC_API_KEY: ${VOC_API_KEY}
      INGESTION_DEAD_LETTER_PATH: "/app/data/ingestion_failed_events.jsonl"
      INGESTION_EVENT_LOG_PATH: "/app/data/processed/uec_events.jsonl"
      SCHEMAS_PATH: "/app/schemas"
      INGESTION_ENABLE_ENRICHMENT: "true"
      INGESTION_FAIL_OPEN: "true"
      INGESTION_HTTP_TIMEOUT_SECONDS: "2.0"
      REDACTOR_URL: "http://sa-redactor:8080"
      NLP_URL: "http://nlp:8081"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-voc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-voc_engine}"
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-voc-engine}
    depends_on:
      nlp:
        condition: service_healthy
      sa-redactor:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ── Decision Intelligence Engine ──────────────────────────────────────────
  decision:
    build:
      context: ./services/decision
      target: production
    container_name: voc-decision-staging
    ports:
      - "8088:8082"
    environment:
      NLP_URL: "http://nlp:8081"
      VOC_API_KEY: ${VOC_API_KEY}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-voc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-voc_engine}"
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-voc-engine}
    depends_on:
      nlp:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ── Sales Research Assistant ───────────────────────────────────────────────
  sales-research:
    build:
      context: .
      dockerfile: services/sales_research/Dockerfile
      target: production
    container_name: voc-sales-research-staging
    ports:
      - "8084:8083"
    environment:
      VOC_API_KEY: ${VOC_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_TIMEOUT_SECONDS: ${CLAUDE_TIMEOUT_SECONDS:-30}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      TAVILY_TIMEOUT_SECONDS: ${TAVILY_TIMEOUT_SECONDS:-15}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-voc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-voc_engine}"
      SCHEMAS_PATH: "/app/schemas"
      SALES_BRIEF_CACHE_DAYS: ${SALES_BRIEF_CACHE_DAYS:-7}
      SALES_EMBEDDING_MODEL: ${SALES_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

volumes:
  postgres_staging_data:
    name: voc_postgres_staging_data
